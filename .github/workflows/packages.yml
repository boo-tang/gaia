# Lint, type check and tests of the workspace packages (packages/*), and the Prettier check of the
# whole repository. Also checks that the ABI files in packages/core are the same as the contract
# build, and builds the web app with a fixture deployment file (deployments/ is not in git). The
# server test against Anvil needs Foundry and the contract build.
name: Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push cancels the older run of the same branch.
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Corepack gives the Yarn version of `packageManager` in package.json.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install Foundry (Anvil)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install
        run: yarn install --immutable

      - name: Compile contracts
        run: yarn hardhat compile

      - name: Format check
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn typecheck

      - name: Tests
        run: yarn test:packages

      - name: Check the ABI files
        run: yarn workspace @gaia/core abis:check

      - name: Build the web app
        run: yarn workspace @gaia/web build
        env:
          DEPLOYMENT_FILE: packages/web/test/fixtures/deployment.json
