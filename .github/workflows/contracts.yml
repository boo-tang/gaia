# Compiles the contracts and runs the contract tests.
# On push and pull request, the fuzz tests use their default settings, which are short. Each day,
# a scheduled run tests 200 seeds of each fuzz test, from a different first seed each day. The test
# names show the seeds, and a failure prints the command to repeat it. To run more seeds by hand,
# start the workflow (Actions > Contracts > Run workflow) and set "fuzz_runs".
name: Contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzz_runs:
        description: Number of seeds for each fuzz test (empty for the default)
        required: false
        default: ""

# A push cancels the older run of the same branch. The scheduled run has its own group, so a push
# does not cancel it.
concurrency:
  group: contracts-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Corepack gives the Yarn version of `packageManager` in package.json.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Compile
        run: yarn hardhat compile

      - name: Test
        env:
          LAND_FUZZ_RUNS: ${{ inputs.fuzz_runs }}
          AUCTION_FUZZ_RUNS: ${{ inputs.fuzz_runs }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 200 seeds of each fuzz test. The first seed changes each day.
            first=$(( $(date -u +%s) / 86400 * 1000 ))
            export LAND_FUZZ_RUNS=200 AUCTION_FUZZ_RUNS=200
            export LAND_FUZZ_FIRST_SEED=$first AUCTION_FUZZ_FIRST_SEED=$first
            echo "Fuzz seeds $first to $(( first + 199 ))"
          fi
          # An empty value means the default. Remove the empty variables.
          for name in LAND_FUZZ_RUNS AUCTION_FUZZ_RUNS; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          yarn hardhat test
